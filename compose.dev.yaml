services:
  ngrok:
    image: ngrok/ngrok:3-alpine
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      ["http", "--domain=${NGROK_DOMAIN:?NGROK_DOMAIN is required}", "nginx:8080"]
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    ports:
      - "8080:8080"

  predeployment_register_webhook:
    build:
      context: .
      dockerfile: deployment/predeployment/Dockerfile
    env_file: .env
    command: ["register-webhook"]
    depends_on:
      predeployment_validate:
        condition: service_completed_successfully
      nginx:
        condition: service_healthy
      ngrok:
        condition: service_started
