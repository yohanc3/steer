services:
  certificate_prepare:
    build:
      context: .
      dockerfile: deployment/certificates/Dockerfile
    env_file: .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - nginx-certificates:/certs

  nginx:
    build:
      context: .
      dockerfile: deployment/nginx/Dockerfile
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./deployment/nginx/gateway.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certificates:/etc/nginx/certs
      - certbot-webroot:/var/www/certbot
      - letsencrypt-data:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_gateway/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      certificate_prepare:
        condition: service_completed_successfully

  predeployment_issue_certificate:
    image: certbot/certbot:v3.3.0
    env_file: .env
    volumes:
      - letsencrypt-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - nginx-certificates:/certs
    entrypoint: /bin/sh
    command:
      - -ec
      - >-
        domain="$${PUBLIC_BASE_URL#https://}"; domain="$${domain%%/*}";
        certbot certonly --webroot --webroot-path /var/www/certbot
        --email "$${LETSENCRYPT_EMAIL}" --agree-tos --non-interactive --keep-until-expiring
        -d "$${domain}" &&
        cp -L /etc/letsencrypt/live/$${domain}/fullchain.pem /certs/fullchain.pem &&
        cp -L /etc/letsencrypt/live/$${domain}/privkey.pem /certs/privkey.pem &&
        touch /certs/.reload
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  certbot-webroot:
  letsencrypt-data:
  nginx-certificates:
