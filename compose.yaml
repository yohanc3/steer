name: steer

services:
  predeployment_validate:
    build:
      context: .
      dockerfile: deployment/predeployment/Dockerfile
    env_file: .env
    command: ["validate"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: /data/steer.sqlite
    volumes:
      - steer-data:/data
    depends_on:
      predeployment_validate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID:-}
        VITE_TELLER_ENVIRONMENT: ${TELLER_ENVIRONMENT:-}
    depends_on:
      predeployment_validate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deployment/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_gateway/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  backup:
    build:
      context: .
      dockerfile: deployment/backup/Dockerfile
    volumes:
      - steer-data:/data
      - ./backups:/backups

volumes:
  steer-data:
