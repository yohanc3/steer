name: steer

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: /data/steer.sqlite
    volumes:
      - steer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_TELLER_APPLICATION_ID: ${TELLER_APPLICATION_ID:?TELLER_APPLICATION_ID is required}
        VITE_TELLER_ENVIRONMENT: ${TELLER_ENVIRONMENT:?TELLER_ENVIRONMENT is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:8080"
    volumes:
      - ./deployment/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_gateway/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  steer-data:
